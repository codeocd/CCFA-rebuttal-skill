name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 解析器回归 + 示例全链路
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 单元测试（5 类审稿格式 fixtures）
        run: node tests/run_tests.mjs

      - name: 示例全链路（parse → workbench → check → assemble）
        run: |
          node skills/ccfa-rebuttal/scripts/parse_reviews.mjs \
            examples/aaai27-demo/reviews.txt \
            --out /tmp/ci-ws --limit 1500 --threshold 6
          node skills/ccfa-rebuttal/scripts/build_workbench.mjs /tmp/ci-ws
          node skills/ccfa-rebuttal/scripts/assemble_rebuttal.mjs /tmp/ci-ws -o /tmp/ci-final

      - name: 字符预算校验必须通过
        run: |
          # 用仓库里已填写的示例分片做校验，确保三口径（check/workbench/assemble）不漂移
          node skills/ccfa-rebuttal/scripts/parse_reviews.mjs --check examples/aaai27-demo/workspace \
            | tee /tmp/check.txt
          grep -q "可以提交" /tmp/check.txt

      - name: SKILL.md 结构自检
        run: |
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("skills/ccfa-rebuttal/SKILL.md", "utf8");
            const fm = s.match(/^---\n([\s\S]*?)\n---\n/);
            if (!fm) throw new Error("SKILL.md 缺少 frontmatter");
            const name = fm[1].match(/^name:\s*(.+)$/m)[1];
            const desc = fm[1].match(/^description:\s*([\s\S]+)$/m)[1];
            if (!/^[a-z0-9-]+$/.test(name)) throw new Error("name 不是 hyphen-case: " + name);
            if (desc.includes("\n")) throw new Error("description 必须单行");
            if (desc.length > 1024) throw new Error("description 超 1024 字符: " + desc.length);
            if (s.split("\n").length > 520) throw new Error("SKILL.md 过长");
            if (/TODO:/.test(s)) throw new Error("残留 TODO");
            console.log("SKILL.md OK: name=" + name + ", desc=" + desc.length + " chars");
          '
